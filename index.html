<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1d33">
<!-- GAME:START -->
<title>Revier 17</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one big top-down station drawn on a canvas, the duty desk (cases, staff, log) underneath; phones put open cases above the station. */
:root {
  --night: #0f1d33;        /* page ground, police navy at night */
  --panel: #172a48;        /* desk / panel surface */
  --line: #2c4670;         /* floor-plan lines */
  --chalk: #e6edf7;        /* primary text */
  --muted: #8ea3c4;        /* secondary text */
  --signal: #3d8bff;       /* Blaulicht accent */
  --amber: #f2b33d;        /* budget / money */
  --ok: #4fcf8a;
  --bad: #ff5d5d;
  --display: "Saira Stencil One", "Impact", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --data: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--night);
  background-image:
    linear-gradient(rgba(61,139,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(61,139,255,.05) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--chalk);
  font: 15px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }

/* ---------- header ---------- */
header.hq {
  display: grid; gap: 12px;
  grid-template-columns: 1fr auto;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 14px 16px;
  position: relative; overflow: hidden;
}
header.hq::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
  background: linear-gradient(90deg, var(--signal) 0 50%, var(--bad) 50% 100%);
  animation: siren 1.2s infinite;
}
@keyframes siren { 50%, 100% { background: linear-gradient(90deg, var(--bad) 0 50%, var(--signal) 50% 100%); } }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { margin: 0; font: 400 clamp(26px, 5vw, 38px)/1 var(--display); letter-spacing: .02em; text-wrap: balance; }
.brand .sub { color: var(--muted); font: 600 12px/1 var(--data); letter-spacing: .14em; text-transform: uppercase; }
.lvl { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lvl .badge {
  width: 52px; height: 52px; flex: none;
  display: grid; place-items: center;
  font: 400 24px/1 var(--display);
  background: radial-gradient(circle at 50% 35%, #2a4f8c, #14284a);
  border: 2px solid var(--signal);
  clip-path: polygon(50% 0, 100% 18%, 92% 80%, 50% 100%, 8% 80%, 0 18%);
}
.xpbox { display: grid; gap: 4px; width: 170px; }
.xpbox small { color: var(--muted); font: 600 12px/1 var(--data); letter-spacing: .08em; text-transform: uppercase; }
.bar { height: 8px; background: #0b1527; border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--signal); transition: width .25s; }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: #0f2140; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-width: 0; }
.stat b { display: block; font: 700 clamp(17px, 3vw, 22px)/1.1 var(--data); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { color: var(--muted); font: 600 11px/1 var(--data); letter-spacing: .1em; text-transform: uppercase; }
.stat.money b { color: var(--amber); }
.stars { color: var(--amber); letter-spacing: 1px; }
.stars .off { color: #3b4b66; }

h2 {
  margin: 0 0 10px; font: 700 13px/1 var(--data); letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
h2 em { font-style: normal; color: var(--chalk); letter-spacing: .04em; }

/* ---------- station canvas ---------- */
.main { display: grid; gap: 16px; }
.stage-card { min-width: 0; }
.stage {
  position: relative;
  border: 2px solid var(--line); border-radius: 6px; overflow: hidden;
  background: #16231d;
  touch-action: manipulation;
}
.stage canvas { display: block; width: 100%; height: auto; }
.pop {
  position: absolute; z-index: 5; width: 232px;
  background: rgba(16,30,54,.97); border: 1px solid var(--signal); border-radius: 6px;
  padding: 12px; display: grid; gap: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
.pop-x { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; border-radius: 4px; }
.pop-x:hover { color: var(--chalk); background: rgba(255,255,255,.06); }
.pop-name { font: 400 21px/1.05 var(--display); padding-right: 26px; }
.pop-state { font: 600 11px/1.2 var(--data); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pop-state.warn { color: var(--amber); }
.pop-line { font: 600 13px/1.35 var(--data); color: var(--muted); font-variant-numeric: tabular-nums; }
.pop-line b { color: var(--amber); }
.pop-line .pen { color: var(--bad); }
.pop-hint { font-size: 13px; line-height: 1.35; color: var(--muted); }
.pop-hint:empty { display: none; }
.pips { display: flex; gap: 3px; }
.pips i { width: 14px; height: 5px; background: #24385a; border-radius: 1px; }
.pips i.on { background: var(--signal); box-shadow: 0 0 6px rgba(61,139,255,.6); }

.btn {
  border: 1px solid var(--signal); background: rgba(61,139,255,.15);
  border-radius: 4px; padding: 8px 12px; font: 700 14px/1.1 var(--data); letter-spacing: .03em;
  display: inline-flex; gap: 6px; align-items: center; justify-content: center; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: rgba(61,139,255,.3); }
.btn:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); }
.btn.gold { border-color: var(--amber); background: rgba(242,179,61,.14); }
.btn.gold:hover:not(:disabled) { background: rgba(242,179,61,.28); }
.btn.ghost { border-color: var(--line); background: transparent; color: var(--muted); }

/* ---------- desk ---------- */
.desk { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0; }
.case { display: grid; gap: 6px; padding: 10px; border-radius: 4px; background: #0f2140; border-left: 3px solid var(--signal); }
.case + .case { margin-top: 8px; }
.case.active { border-left-color: var(--ok); }
.case.urgent { border-left-color: var(--bad); }
.case-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.case-top strong { font: 700 15px/1.2 var(--data); display: flex; gap: 7px; align-items: baseline; min-width: 0; }
.case-top strong i { width: 9px; height: 9px; border-radius: 2px; flex: none; transform: translateY(-1px); }
.case-top small { color: var(--muted); font: 600 11px/1 var(--data); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.case-meta { display: flex; gap: 10px; flex-wrap: wrap; font: 600 13px/1.2 var(--data); color: var(--muted); font-variant-numeric: tabular-nums; }
.case-meta .r { color: var(--amber); }
.case .bar { height: 6px; }
.case.active .bar > i { background: var(--ok); }
.case.urgent .bar > i { background: var(--bad); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
.staff { display: grid; gap: 8px; }
.staff-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; background: #0f2140; border-radius: 4px; }
.staff-row svg { display: block; }
.staff-row strong { display: block; font: 700 15px/1.2 var(--data); }
.staff-row strong span { color: var(--muted); font-weight: 600; }
.staff-row small { color: var(--muted); font-size: 12px; line-height: 1.3; display: block; }
.log { font: 500 13px/1.4 var(--data); color: var(--muted); display: grid; gap: 4px; max-height: 260px; overflow: auto; }
.log div b { color: var(--chalk); font-weight: 600; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 12px; }

/* ---------- overlays ---------- */
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; width: min(92vw, 380px); }
.toast { background: #0b1527; border: 1px solid var(--line); border-left: 3px solid var(--signal); padding: 9px 12px; border-radius: 4px; font: 600 14px/1.3 var(--data); animation: tin .25s ease-out; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.toast.bad { border-left-color: var(--bad); }
.toast.good { border-left-color: var(--ok); }
@keyframes tin { from { transform: translateY(10px); opacity: 0; } }
.modal-bg { position: fixed; inset: 0; z-index: 70; background: rgba(5,10,20,.75); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); border: 2px solid var(--signal); border-radius: 8px; padding: 22px; max-width: 420px; width: 100%; text-align: center; display: grid; gap: 12px; justify-items: center; }
.modal h3 { margin: 0; font: 400 32px/1 var(--display); }
.modal p { margin: 0; color: var(--muted); }
.modal .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

@media (max-width: 980px) {
  .desk { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .desk .log-card { grid-column: 1 / -1; }
}
@media (max-width: 700px) {
  /* phones: open cases above the station, staff and log below */
  .main { display: flex; flex-direction: column; gap: 16px; }
  .desk { display: contents; }
  .cases-card { order: -1; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  header.hq { grid-template-columns: minmax(0, 1fr); }
  .xpbox { width: auto; flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <header class="hq">
    <div class="brand">
      <h1>Polizeirevier 17</h1>
      <span class="sub">Bring die Wache auf Vordermann</span>
    </div>
    <div class="lvl">
      <div class="badge" id="lvlBadge">1</div>
      <div class="xpbox">
        <small id="lvlLabel">Revierstufe 1</small>
        <div class="bar"><i id="xpBar"></i></div>
        <small id="xpText">0 / 80 EP</small>
      </div>
    </div>
    <div class="stats">
      <div class="stat money"><span>Budget</span><b id="sMoney">0 €</b></div>
      <div class="stat"><span>Einnahmen</span><b id="sIncome">0 €/s</b></div>
      <div class="stat"><span>Ruf</span><b id="sRep" class="stars"></b></div>
      <div class="stat"><span>Gelöste Fälle</span><b id="sSolved">0</b></div>
    </div>
  </header>

  <div class="main">
    <section class="stage-card">
      <h2>Revier <em id="planInfo"></em></h2>
      <div class="stage" id="stage">
        <canvas id="cv" aria-label="Grundriss des Polizeireviers. Tippe auf Dreck zum Aufräumen und auf einen Raum zum Ausbauen."></canvas>
        <div class="pop" id="pop" hidden>
          <button class="pop-x" id="popX" type="button" aria-label="Schließen">×</button>
          <div class="pop-name" id="popName"></div>
          <div class="pop-state" id="popState"></div>
          <div class="pips" id="popPips"></div>
          <div class="pop-line" id="popLine"></div>
          <button class="btn gold" id="popBtn" type="button"></button>
          <div class="pop-hint" id="popHint"></div>
        </div>
      </div>
    </section>
    <div class="desk">
      <div class="card cases-card">
        <h2>Einsätze <em id="slotInfo"></em></h2>
        <div id="cases"></div>
      </div>
      <div class="card">
        <h2>Personal</h2>
        <div class="staff" id="staff"></div>
      </div>
      <div class="card log-card">
        <h2>Funkprotokoll</h2>
        <div class="log" id="log"></div>
        <div class="foot">
          <span>Spielstand wird automatisch gespeichert.</span>
          <button class="btn ghost" id="resetBtn" type="button">Neu anfangen</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script>
(() => {
'use strict';

// ---------- data ----------
const ROOMS = [
  { id: 'empfang',  name: 'Empfang',            unlock: 1,  cost: 40,      base: 1,    floor: '#c9b48f', tile: 22, color: '#d9a35b' },
  { id: 'buero',    name: 'Wachbüro',           unlock: 1,  cost: 150,     base: 3,    floor: '#56688a', tile: 0,  color: '#6f8fd1' },
  { id: 'zellen',   name: 'Gewahrsam',          unlock: 2,  cost: 600,     base: 9,    floor: '#868c94', tile: 44, color: '#a3acb8' },
  { id: 'verhoer',  name: 'Vernehmung',         unlock: 3,  cost: 2000,    base: 24,   floor: '#4b505a', tile: 0,  color: '#9b7fd6' },
  { id: 'fuhrpark', name: 'Fuhrpark',           unlock: 4,  cost: 6000,    base: 60,   floor: '#3b3f46', tile: 0,  color: '#4fb3d9' },
  { id: 'asservat', name: 'Asservatenkammer',   unlock: 6,  cost: 20000,   base: 150,  floor: '#b1a07c', tile: 30, color: '#c9a24a' },
  { id: 'labor',    name: 'Kriminaltechnik',    unlock: 8,  cost: 70000,   base: 400,  floor: '#d6dce3', tile: 18, color: '#4fcf8a' },
  { id: 'training', name: 'Einsatztraining',    unlock: 10, cost: 220000,  base: 1000, floor: '#3c7656', tile: 0,  color: '#7ccf4f' },
  { id: 'heli',     name: 'Hubschrauberplatz',  unlock: 13, cost: 750000,  base: 2800, floor: '#3a3f48', tile: 50, color: '#ff8a4f' },
  { id: 'leit',     name: 'Leitstelle',         unlock: 16, cost: 2500000, base: 8000, floor: '#24324a', tile: 0,  color: '#ff5d8f' },
];
const MAX_ROOM_LVL = 10;

const MESS = [
  { name: 'Müllsäcke',     hp: 1 },
  { name: 'Spinnweben',    hp: 1 },
  { name: 'Aktenberg',     hp: 2 },
  { name: 'Kaputte Lampe', hp: 2 },
  { name: 'Graffiti',      hp: 3 },
  { name: 'Wasserschaden', hp: 3 },
  { name: 'Kakerlake',     hp: 1 },
];

const CASES = {
  empfang:  ['Fundsache abgeben', 'Anzeige: Fahrraddiebstahl', 'Verirrter Tourist'],
  buero:    ['Ruhestörung', 'Nachbarschaftsstreit', 'Falschparker-Welle'],
  zellen:   ['Kneipenschlägerei', 'Randale am Bahnhof', 'Betrunkener Autofahrer'],
  verhoer:  ['Einbruchserie', 'Taschendiebe-Bande', 'Erpressung'],
  fuhrpark: ['Verfolgungsjagd', 'Illegales Autorennen', 'Unfallflucht'],
  asservat: ['Drogenfund', 'Hehlerware sichern', 'Waffenfund im Park'],
  labor:    ['Mordfall Villa Rosen', 'Fingerabdruck-Rätsel', 'DNA-Abgleich'],
  training: ['Geiselnahme', 'Großeinsatz Fußballspiel', 'Amoklage (Übung)'],
  heli:     ['Bankraub mit Flucht', 'Vermisstensuche im Wald', 'Schmuggler auf der Autobahn'],
  leit:     ['Organisierte Kriminalität', 'Cyberangriff auf Rathaus', 'Großfahndung'],
};

const STAFF = [
  { id: 'officer', name: 'Streifenbeamte', unlock: 1, base: 120,  mult: 2.1, uniform: '#1f4f9a', cap: '#13284d', desc: n => `Eine Streife mehr für Einsätze · aktuell ${n}` },
  { id: 'janitor', name: 'Hausmeister',    unlock: 2, base: 300,  mult: 2.0, uniform: '#3c8d5a', cap: '#e8822e', desc: n => n ? `${n} unterwegs, räumen selbstständig auf` : 'Läuft herum und räumt Unordnung weg' },
  { id: 'admin',   name: 'Verwaltung',     unlock: 3, base: 800,  mult: 2.3, uniform: '#6d7a8c', cap: null,      desc: n => `+15 % Einnahmen je Kraft · aktuell +${n * 15} %` },
  { id: 'chief',   name: 'Kommissar',      unlock: 6, base: 5000, mult: 2.6, uniform: '#7a5a3a', cap: null,      desc: n => `Einsätze ${Math.min(60, n * 12)} % schneller, mehr Belohnung` },
];

// two floor plans of the same building: wide screens get 5×2, phones 2×5. The Empfang always faces the street.
const LAYOUTS = {
  wide: { cols: 5, rows: 2, zw: 200, zh: 176, order: [[5, 6, 7, 8, 9], [0, 1, 2, 3, 4]] },
  tall: { cols: 2, rows: 5, zw: 200, zh: 168, order: [[8, 9], [6, 7], [4, 5], [2, 3], [0, 1]] },
};

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' Mrd.';
  if (n >= 1e6) return (n / 1e6).toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' Mio.';
  return n.toLocaleString('de-DE');
};
const eur = n => fmt(n) + ' €';
const rate = n => (n < 10 ? n.toLocaleString('de-DE', { maximumFractionDigits: 1 }) : fmt(n)) + ' €/s';
const xpNeed = l => Math.round(80 * Math.pow(1.55, l - 1));
const roomIdx = id => ROOMS.findIndex(r => r.id === id);
const upgradeCost = (r, lvl) => Math.round(r.cost * Math.pow(1.8, lvl));
const staffCost = (s, n) => Math.round(s.base * Math.pow(s.mult, s.id === 'officer' ? n - 1 : n));
function seeded(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function mix(a, b, t) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((A >> s) & 255) * (1 - t) + ((B >> s) & 255) * t);
  return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join('');
}
let uid = 1;

// ---------- state ----------
const SAVE_KEY = 'revier17-save-v1';
function freshState() {
  return {
    money: 25, xp: 0, level: 1, rep: 20,
    rooms: {}, staff: { officer: 1, janitor: 0, admin: 0, chief: 0 },
    cases: [], nextCase: 4, messTimer: 15,
    solved: 0, cleaned: 0, log: [], last: Date.now(), uid: 1,
  };
}
let S;

function makeMess(idx) {
  const kind = Math.floor(Math.random() * Math.min(MESS.length, 3 + idx));
  return { id: uid++, k: kind, hp: MESS[kind].hp + Math.floor(idx / 3), x: rand(12, 88), y: rand(34, 86) };
}
function unlockRooms(silent) {
  ROOMS.forEach((r, i) => {
    if (r.unlock <= S.level && !S.rooms[r.id]) {
      const n = Math.min(6, 3 + Math.floor(i / 2));
      S.rooms[r.id] = { lvl: 0, mess: Array.from({ length: n }, () => makeMess(i)) };
      if (!silent) log(`<b>${r.name}</b> freigeschaltet, völlig verwahrlost.`);
    }
  });
}

// ---------- economy ----------
function roomIncome(r, st) {
  if (!st || st.lvl === 0) return 0;
  const base = r.base * st.lvl * Math.pow(1.15, st.lvl - 1);
  const pen = Math.max(0.4, 1 - 0.15 * st.mess.length);
  return base * pen * globalMult();
}
function globalMult() { return (1 + S.staff.admin * 0.15) * (0.5 + S.rep / 100); }
function totalIncome() { return ROOMS.reduce((s, r) => s + roomIncome(r, S.rooms[r.id]), 0); }
function addXp(x) {
  S.xp += x;
  const startLvl = S.level;
  while (S.xp >= xpNeed(S.level)) { S.xp -= xpNeed(S.level); S.level++; }
  if (S.level > startLvl) {
    unlockRooms();
    const fresh = ROOMS.filter(r => r.unlock > startLvl && r.unlock <= S.level);
    const bonus = 50 * S.level * S.level;
    S.money += bonus;
    log(`Revier erreicht <b>Stufe ${S.level}</b>!`);
    showLevelUp(S.level, fresh, bonus);
    markDirty();
  }
}
function addRep(d) { S.rep = clamp(S.rep + d, 0, 100); }

// ---------- actions ----------
function hitMess(roomId, m, pt) {
  m.hp--;
  burst(pt.x, pt.y, 'dust', 7);
  if (m.hp <= 0) removeMess(roomIdx(roomId), m, true, pt);
  markDirty();
}
function removeMess(idx, m, byPlayer, pt) {
  const r = ROOMS[idx]; const st = S.rooms[r.id];
  st.mess = st.mess.filter(x => x !== m);
  S.cleaned++;

function step(dt) {

  for (const c of S.cases) {
    if (c.active) {
      c.t += dt;
      if (c.t >= c.dur) {
        c.done = true;
        S.solved++;
        S.money += c.reward;
        addXp(c.xp);
        addRep(2);

        log(`Gelöst: <b>${c.title}</b>`);

    } else {
      c.age += dt;

function drawFloor(c, i, z, ruin) {
  const r = ROOMS[i];
  c.fillStyle = ruin ? mix(r.floor, '#4d4132', 0.55) : r.floor; c.fillRect(z.x, z.y, z.w, z.h);
  const rnd = seeded(i * 101 + 3);
  if (r.tile) {
    for (let y = z.y; y < z.y + z.h; y += r.tile) for (let x = z.x; x < z.x + z.w; x += r.tile) {
      const v = rnd();
      c.fillStyle = v < 0.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';
      c.fillRect(x, y, r.tile, r.tile);
      c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 0.8; c.strokeRect(x + .4, y + .4, r.tile, r.tile);
      if (ruin && v > 0.88) { c.fillStyle = 'rgba(20,14,8,.55)'; c.fillRect(x + 1, y + 1, r.tile - 2, r.tile - 2); }
    }
  } else {
    for (let k = 0; k < 260; k++) { c.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.05)'; c.fillRect(z.x + rnd() * z.w, z.y + rnd() * z.h, 1.5, 1.5); }

      const x = z.x + rnd() * z.w, y = z.y + rnd() * z.h, rad = 10 + rnd() * 26;
      const g = c.createRadialGradient(x, y, 0, x, y, rad);

      c.fillStyle = g; c.fillRect(x - rad, y - rad, rad * 2, rad * 2);

    for (let k = 0; k < 4; k++) {

      for (let s = 0; s < 5; s++) { x += (rnd() - 0.5) * 22; y += (rnd() - 0.5) * 22; c.lineTo(clamp(x, z.x, z.x + z.w), clamp(y, z.y, z.y + z.h)); }
      c.stroke();
    }
  }
}

function drawDebris(c, i, z) {
  const rnd = seeded(i * 31 + 9);
  for (let k = 0; k < 3; k++) {
    const x = z.x + 24 + rnd() * (z.w - 48), y = z.y + 46 + rnd() * (z.h - 70), t = rnd();
    c.save(); c.translate(x, y); c.rotate(rnd() * Math.PI);

function drawWalls(c) {
  const WT = 8, IT = 6, GAP = 30;
  const wall = (x, y, w, h) => { c.fillStyle = '#c4cbd6'; c.fillRect(x, y, w, h); c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x, y + h - 1.5, w, 1.5); };
  const bw = L.cols * L.zw, bh = L.rows * L.zh;
  // interior walls with a door to every neighbour
  ROOMS.forEach((_, i) => {
    const { c: cc, r } = cells[i];
    ROOMS.forEach((_, j) => {
      const d = cells[j];
      if (d.r === r && d.c === cc + 1) {
        const x = M + d.c * L.zw - IT / 2, y0 = M + r * L.zh, dy = door(i, j).y;
        wall(x, y0, IT, dy - GAP / 2 - y0); wall(x, dy + GAP / 2, IT, y0 + L.zh - dy - GAP / 2);
        if (!isOpen(i) || !isOpen(j)) tape(c, x - 1, dy - GAP / 2, IT + 2, GAP, true);
      }
      if (d.c === cc && d.r === r + 1) {
        const y = M + d.r * L.zh - IT / 2, x0 = M + cc * L.zw, dx = door(i, j).x;
        wall(x0, y, dx - GAP / 2 - x0, IT); wall(dx + GAP / 2, y, x0 + L.zw - dx - GAP / 2, IT);
        if (!isOpen(i) || !isOpen(j)) tape(c, dx - GAP / 2, y - 1, GAP, IT + 2, false);
      }
    });
  });
  // outer walls, entrance in the bottom wall of the Empfang
  const e = entrance();
  wall(M - WT / 2, M - WT / 2, bw + WT, WT);
  wall(M - WT / 2, M - WT / 2, WT, bh + WT);

// ---------- frame ----------
function resize() {
  const w = $('stage').clientWidth;
  const want = w < 620 ? 'tall' : 'wide';
  if (want !== layoutName) {
    const first = !layoutName;
    setLayout(want);
    if (!first) {
      // keep everyone in their rooms after switching floor plans
      for (const a of actors) { if (a.room >= 0) { const p = randIn(a.room); a.x = p.x; a.y = p.y; } else { const o = outside(); a.x = o.x; a.y = o.y; } a.path = []; }
      parts = []; floats = [];
    }
  }
  dpr = Math.min(2, window.devicePixelRatio || 1);
  scale = w / world.W;
  cv.width = Math.round(world.W * scale * dpr); cv.height = Math.round(world.H * scale * dpr);
  cv.style.height = (world.H * scale) + 'px';
  bg.width = cv.width; bg.height = cv.height;
  staticDirty = true;
  placePop();
}

function drawFrame(dt) {
  if (staticDirty) {
    bctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    drawStatic(bctx);
    staticDirty = false;
  }
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.drawImage(bg, 0, 0);
  c.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);

  ROOMS.forEach((r, i) => drawRoomDynamic(c, i));
  ROOMS.forEach((r, i) => { const st = S.rooms[r.id]; if (st) { const z = zone(i); st.mess.forEach(m => drawMess(c, m, messPos(m, z))); } });

  // tutorial ring around the very first piece of mess
  if (S.cleaned === 0 && S.rooms.empfang.mess.length) {
    const p = messPos(S.rooms.empfang.mess[0], zone(0));
    const ph = (T % 1.2) / 1.2;
    c.strokeStyle = `rgba(242,179,61,${1 - ph})`; c.lineWidth = 2.5; c.beginPath(); c.arc(p.x, p.y, 14 + ph * 16, 0, Math.PI * 2); c.stroke();
    c.font = '700 11px "Barlow Semi Condensed", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    box(c, p.x - 50, p.y - 44, 100, 18, 3, 'rgba(10,18,32,.9)');
    c.fillStyle = '#f2b33d'; c.fillText('Tippen zum Aufräumen', p.x, p.y - 35); c.textAlign = 'left';
  }

  // people and cars, sorted by depth
  const drawables = [
    ...actors.filter(a => !a.hidden).map(a => ({ y: a.y, f: () => drawPerson(c, a) })),
    ...cars.map(k => ({ y: k.y, f: () => drawCar(c, k.x, k.y, k.dir < 0 ? Math.PI : 0, k.phase !== 'park' && k.phase !== 'done', k.phase === 'done' ? clamp(k.fade / 0.6, 0, 1) : 1) })),
  ];
  drawables.sort((a, b) => a.y - b.y).forEach(d => d.f());

  // upgrade hints, flashes, selection
  ROOMS.forEach((r, i) => {
    const st = S.rooms[r.id]; if (!st) return; const z = zone(i);
    if (flash[i] > 0) { c.fillStyle = `rgba(255,255,255,${flash[i] * 0.35})`; c.fillRect(z.x, z.y, z.w, z.h); flash[i] = Math.max(0, flash[i] - dt * 1.5); }
    const can = st.lvl < MAX_ROOM_LVL && !(st.lvl === 0 && st.mess.length) && S.money >= upgradeCost(r, st.lvl);
    if (can) {
      const x = z.x + z.w - 20, y = z.y + 21 + Math.sin(T * 4 + i) * 2.5;
      shadowOn(c, 6, 1); circle(c, x, y, 11, '#f2b33d'); shadowOff(c);
      c.strokeStyle = '#2a1d00'; c.lineWidth = 2.5; c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath(); c.moveTo(x - 5, y + 2.5); c.lineTo(x, y - 3); c.lineTo(x + 5, y + 2.5); c.stroke();
    }
  });
  if (sel !== null) {
    const z = zone(sel);
    c.strokeStyle = '#3d8bff'; c.lineWidth = 3; c.shadowColor = 'rgba(61,139,255,.8)'; c.shadowBlur = 10;
    c.strokeRect(z.x + 4, z.y + 4, z.w - 8, z.h - 8); shadowOff(c);
  }

  for (const p of parts) {
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92;
    const k = 1 - p.life / p.max;
    if (p.kind === 'dust') circle(c, p.x, p.y, p.r * (1.6 - k * 0.6), `rgba(200,190,170,${0.5 * k})`);
    else { c.fillStyle = `rgba(255,236,150,${k})`; star(c, p.x, p.y, p.r * 2, p.r * 0.6, 4); }
  }
  parts = parts.filter(p => p.life < p.max);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '700 13px "Barlow Semi Condensed", sans-serif';
  for (const f of floats) {
    f.life += dt;
    c.globalAlpha = clamp((1 - f.life / 1.2) * 1.5, 0, 1);
    c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,.6)'; c.strokeText(f.txt, f.x, f.y - f.life * 30);
    c.fillStyle = f.color; c.fillText(f.txt, f.x, f.y - f.life * 30);
  }
  c.globalAlpha = 1; c.textAlign = 'left';
  floats = floats.filter(f => f.life < 1.2);
}

function viewStep(dt) {
  T += dt;
  syncActors(false);
  for (const a of actors) updateActor(a, dt);
  actors = actors.filter(a => !a.gone);
  updateCars(dt);
  // small income pop-ups over running rooms
  ROOMS.forEach((r, i) => {
    const st = S.rooms[r.id]; if (!st || !st.lvl) return;
    incomeTimers[i] = (incomeTimers[i] ?? rand(1, 5)) - dt;
    if (incomeTimers[i] <= 0) {
      incomeTimers[i] = rand(4, 7);
      const z = zone(i); const amt = roomIncome(r, st) * 5;
      if (amt >= 1) floatText(z.x + z.w * rand(0.3, 0.7), z.y + z.h * 0.5, '+' + eur(amt), 'rgba(242,179,61,.85)');
    }
  });
}

// ---------- input on the station ----------
function toWorld(e) { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) / scale, y: (e.clientY - b.top) / scale }; }
function messAt(pt) {
  let best = null, bd = 22;
  ROOMS.forEach((r, i) => {
    const st = S.rooms[r.id]; if (!st) return; const z = zone(i);
    for (const m of st.mess) { const p = messPos(m, z); const d = Math.hypot(p.x - pt.x, p.y - pt.y); if (d < bd) { bd = d; best = { i, m, p }; } }
  });
  return best;
}
cv.addEventListener('pointerdown', e => {
  const pt = toWorld(e);
  const hit = messAt(pt);
  if (hit) { hitMess(ROOMS[hit.i].id, hit.m, hit.p); return; }
  const i = roomAt(pt.x, pt.y);
  select(i >= 0 && i !== sel ? i : null);
});
cv.addEventListener('pointermove', e => {
  const pt = toWorld(e);
  cv.style.cursor = messAt(pt) || roomAt(pt.x, pt.y) >= 0 ? 'pointer' : 'default';
});
function select(i) { sel = i; renderPop(); }
$('popX').addEventListener('click', () => select(null));
$('popBtn').addEventListener('click', () => { if (sel !== null) upgradeRoom(sel); });

function placePop() {
  const pop = $('pop'); if (sel === null || !L) return;
  const z = zone(sel); const stageW = $('stage').clientWidth; const stageH = world.H * scale;
  const pw = pop.offsetWidth || 232, ph = pop.offsetHeight || 150;
  const left = clamp((z.x + z.w / 2) * scale - pw / 2, 8, stageW - pw - 8);
  let top = (z.y + z.h) * scale - 10;
  if (top + ph > stageH - 8) top = z.y * scale - ph + 10;
  pop.style.left = left + 'px'; pop.style.top = clamp(top, 8, Math.max(8, stageH - ph - 8)) + 'px';
}
function renderPop() {
  const pop = $('pop');
  if (sel === null) { pop.hidden = true; return; }
  const r = ROOMS[sel]; const st = S.rooms[r.id];
  pop.hidden = false;
  $('popName').textContent = r.name;
  const stateEl = $('popState'), btn = $('popBtn'), hint = $('popHint'), line = $('popLine');
  stateEl.className = 'pop-state';
  if (!st) {
    stateEl.textContent = 'Gesperrt';
    $('popPips').innerHTML = '';
    line.textContent = `Wird mit Revierstufe ${r.unlock} freigeschaltet.`;
    btn.hidden = true; hint.textContent = '';
  } else {
    $('popPips').innerHTML = Array.from({ length: MAX_ROOM_LVL }, (_, k) => `<i class="${k < st.lvl ? 'on' : ''}"></i>`).join('');
    btn.hidden = false;
    if (st.lvl === 0) {
      stateEl.textContent = st.mess.length ? `Verwahrlost · ${st.mess.length}× Unordnung` : 'Aufgeräumt · bereit';
      stateEl.classList.add('warn');
      line.innerHTML = `Nach der Renovierung: <b>${rate(r.base * globalMult())}</b>`;
    } else {
      stateEl.textContent = `Stufe ${st.lvl}${st.lvl >= MAX_ROOM_LVL ? ' · voll ausgebaut' : ''}`;
      const pen = st.mess.length ? ` <span class="pen">−${Math.min(60, st.mess.length * 15)} % durch Unordnung</span>` : '';
      const nextTxt = st.lvl < MAX_ROOM_LVL ? `<br>Nächste Stufe: <b>${rate(roomIncome(r, { lvl: st.lvl + 1, mess: st.mess }))}</b>` : '';
      line.innerHTML = `Einnahmen: <b>${rate(roomIncome(r, st))}</b>${pen}${nextTxt}`;
    }
    if (st.lvl >= MAX_ROOM_LVL) { btn.textContent = 'Voll ausgebaut'; btn.disabled = true; }
    else btn.textContent = `${st.lvl === 0 ? 'Renovieren' : 'Ausbauen'} · ${eur(upgradeCost(r, st.lvl))}`;
    hint.textContent = st.lvl === 0 && st.mess.length ? 'Erst aufräumen: Tippe im Raum auf den Dreck.' : (st.lvl === 0 ? '' : `Typische Einsätze: ${CASES[r.id].join(', ')}.`);
  }
  updatePopBtn();
  placePop();
}
function updatePopBtn() {
  if (sel === null) return;
  const r = ROOMS[sel]; const st = S.rooms[r.id];
  if (!st || st.lvl >= MAX_ROOM_LVL) return;
  $('popBtn').disabled = S.money < upgradeCost(r, st.lvl) || (st.lvl === 0 && st.mess.length > 0);
}

// =====================================================================
// ---------- HTML panels ----------
// =====================================================================
let dirty = true;
function markDirty() { dirty = true; }

function stars(rep) {
  const n = Math.round(rep / 20);
  return '★'.repeat(n) + `<span class="off">${'★'.repeat(5 - n)}</span>`;
}
function avatar(s) {
  return `<svg viewBox="0 0 34 34" width="34" height="34" aria-hidden="true">
    <circle cx="17" cy="17" r="16" fill="#0b1527"/>
    <path d="M5 32c1-8 6-11 12-11s11 3 12 11z" fill="${s.uniform}"/>
    <circle cx="17" cy="14" r="6.5" fill="#e8c4a0"/>
    ${s.cap ? `<path d="M10 12.5a7 7 0 0 1 14 0z" fill="${s.cap}"/><rect x="9" y="11.5" width="16" height="2.6" rx="1.3" fill="${s.cap}"/>` : '<path d="M10.5 13a6.5 6.5 0 0 1 13 0c-2-2-4-2.6-6.5-2.6S12.5 11 10.5 13z" fill="#3a2a1c"/>'}
    ${s.id === 'officer' ? '<circle cx="17" cy="10.5" r="1.3" fill="#f2b33d"/>' : ''}
  </svg>`;
}
function starSvg() {
  const pts = []; for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8 - Math.PI / 2, r = k % 2 ? 24 : 46; pts.push((50 + Math.cos(a) * r).toFixed(1) + ',' + (50 + Math.sin(a) * r).toFixed(1)); }
  return `<svg viewBox="0 0 100 100" width="72" height="72" aria-hidden="true"><polygon points="${pts.join(' ')}" fill="#3d8bff" stroke="#cfe0ff" stroke-width="3"/><circle cx="50" cy="50" r="15" fill="#172a48" stroke="#cfe0ff" stroke-width="3"/></svg>`;
}
function renderHeader() {
  $('sMoney').textContent = eur(S.money);
  $('sIncome').textContent = rate(totalIncome());
  $('sRep').innerHTML = stars(S.rep);
  $('sRep').title = `Ruf ${Math.round(S.rep)} / 100, beeinflusst alle Einnahmen`;
  $('sSolved').textContent = fmt(S.solved);
  $('lvlBadge').textContent = S.level;
  $('lvlLabel').textContent = `Revierstufe ${S.level}`;
  const need = xpNeed(S.level);
  $('xpBar').style.width = Math.min(100, S.xp / need * 100) + '%';
  $('xpText').textContent = `${fmt(S.xp)} / ${fmt(need)} EP`;
}
function renderCases() {
  const box = $('cases');
  const act = activeCount();
  $('slotInfo').textContent = `${act} / ${S.staff.officer} Streifen unterwegs`;
  if (!S.cases.length) {
    box.innerHTML = `<div class="empty">${runningRooms().length ? 'Funkstille. Neue Einsätze kommen gleich rein.' : 'Renoviere den ersten Raum, dann kommen Notrufe rein.'}</div>`;
    return;
  }
  const sorted = [...S.cases].sort((a, b) => (b.active - a.active) || (b.age - a.age));
  box.innerHTML = sorted.map(c => {
    const r = ROOMS[roomIdx(c.room)];
    const left = c.active ? c.dur - c.t : c.expire - c.age;
    const urgent = !c.active && left < 15;
    const pct = c.active ? c.t / c.dur * 100 : (1 - c.age / c.expire) * 100;
    return `<div class="case ${c.active ? 'active' : ''} ${urgent ? 'urgent' : ''}" data-case="${c.id}">
      <div class="case-top"><strong><i style="background:${r.color}"></i>${c.title}</strong><small data-left>${c.active ? 'läuft' : 'offen'} · ${Math.ceil(left)} s</small></div>
      <div class="case-meta"><span class="r">${eur(c.reward)}</span><span>+${c.xp} EP</span><span>${r.name}</span><span>Dauer ${c.dur} s</span></div>
      <div class="bar"><i data-bar style="width:${pct}%"></i></div>
      ${c.active ? '' : `<button class="btn" type="button" data-take="${c.id}" ${act >= S.staff.officer ? 'disabled' : ''}>${act >= S.staff.officer ? 'Keine Streife frei' : 'Streife losschicken'}</button>`}
    </div>`;
  }).join('');
}
function renderStaff() {
  $('staff').innerHTML = STAFF.map(s => {
    const n = S.staff[s.id];
    const cost = staffCost(s, n);
    const locked = S.level < s.unlock;
    return `<div class="staff-row">
      ${avatar(s)}
      <div><strong>${s.name} <span>× ${n}</span></strong><small>${locked ? 'ab Revierstufe ' + s.unlock : s.desc(n)}</small></div>
      <button class="btn gold" type="button" data-hire="${s.id}" data-cost="${cost}" ${locked ? 'disabled data-locked="1"' : ''}>${eur(cost)}</button>
    </div>`;
  }).join('');
}
function renderLog() {
  $('log').innerHTML = S.log.map(l => `<div>${l}</div>`).join('') || '<div>Dienstbeginn. Die Wache ist ein einziges Chaos.</div>';
}
function renderAll() {
  renderCases(); renderStaff(); renderLog(); renderPop(); renderLive();
  $('planInfo').textContent = `${runningRooms().length} / ${ROOMS.length} Räume in Betrieb`;
}
function renderLive() {
  renderHeader();
  document.querySelectorAll('[data-hire]').forEach(b => { if (!b.dataset.locked) b.disabled = S.money < +b.dataset.cost; });
  updatePopBtn();
  for (const c of S.cases) {
    const el = document.querySelector(`[data-case="${c.id}"]`);
    if (!el) { dirty = true; continue; }
    const left = c.active ? c.dur - c.t : c.expire - c.age;
    el.querySelector('[data-left]').textContent = `${c.active ? 'läuft' : 'offen'} · ${Math.max(0, Math.ceil(left))} s`;
    el.querySelector('[data-bar]').style.width = (c.active ? c.t / c.dur * 100 : (1 - c.age / c.expire) * 100) + '%';
    if (!c.active && left < 15) el.classList.add('urgent');
  }
}

// ---------- ui fx ----------
function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  const box = $('toasts');
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), 3200);
}
function log(html) {
  const ts = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  S.log.unshift(`${ts} · ${html}`);
  S.log = S.log.slice(0, 30);
  dirty = true;
}
function modal(html) {
  const root = $('modalRoot');
  root.innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
  const close = () => { root.innerHTML = ''; };
  root.querySelector('.modal-bg').addEventListener('click', e => { if (e.target.classList.contains('modal-bg')) close(); });
  return { root, close };
}
function showLevelUp(lvl, fresh, bonus) {
  const m = modal(`${starSvg()}<h3>Revierstufe ${lvl}</h3>
    <p>Die Wache wird bekannter. Bonus: <b style="color:var(--amber)">${eur(bonus)}</b></p>
    ${fresh.length ? `<p>Neu freigeschaltet: <b style="color:var(--chalk)">${fresh.map(r => r.name).join(', ')}</b></p>` : ''}
    <div class="row"><button class="btn gold" type="button" id="mOk">Weiter</button></div>`);
  m.root.querySelector('#mOk').addEventListener('click', m.close);
}

// ---------- input on panels ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.take) takeCase(+t.dataset.take);
  else if (t.dataset.hire) hire(t.dataset.hire);
});
$('resetBtn').addEventListener('click', () => {
  const m = modal(`<h3>Neu anfangen?</h3><p>Dein gesamter Fortschritt in Revier 17 wird gelöscht.</p>
    <div class="row"><button class="btn ghost" type="button" id="mNo">Abbrechen</button><button class="btn" type="button" id="mYes" style="border-color:var(--bad)">Alles löschen</button></div>`);
  m.root.querySelector('#mNo').addEventListener('click', m.close);
  m.root.querySelector('#mYes').addEventListener('click', () => {
    m.close(); S = freshState(); uid = 1; unlockRooms(true); try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
    actors = []; cars = []; sel = null; syncActors(true);
    log('Neuer Dienstantritt in Revier 17.'); markDirty();
  });
});

// ---------- save / load ----------
function save() {
  S.last = Date.now(); S.uid = uid;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {}
}
function load(snapshot) {
  let data = snapshot && snapshot.money !== undefined ? snapshot : null;
  if (!data) { try { data = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (_) { data = null; } }
  S = Object.assign(freshState(), data || {});
  S.staff = Object.assign(freshState().staff, S.staff || {});
  uid = S.uid || 1;
  unlockRooms(true);
  if (!data) { log('Dienstantritt in Revier 17. Hier muss dringend aufgeräumt werden!'); return; }
  const away = Math.min(2 * 3600, (Date.now() - (S.last || Date.now())) / 1000);
  if (away > 60 && !snapshot) {
    const earned = totalIncome() * away * 0.5;
    if (earned > 1) {
      S.money += earned;
      const m = modal(`${starSvg()}<h3>Willkommen zurück</h3>
        <p>Während der Nachtschicht (${Math.round(away / 60)} Min.) hat dein Revier <b style="color:var(--amber)">${eur(earned)}</b> eingenommen.</p>
        <div class="row"><button class="btn gold" type="button" id="mOk">Dienst antreten</button></div>`);
      m.root.querySelector('#mOk').addEventListener('click', m.close);
    }
  }
}
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else lastTick = performance.now(); });

// ---------- loop ----------
let lastTick = performance.now(), saveTimer = 0;
function tick(now) {
  const dt = Math.min(0.1, (now - lastTick) / 1000);
  lastTick = now;
  step(dt);
  viewStep(dt);
  if (dirty) { dirty = false; renderAll(); staticDirty = true; } else renderLive();
  drawFrame(dt);
  saveTimer += dt;
  if (saveTimer > 5) { save(); saveTimer = 0; }
  requestAnimationFrame(tick);
}

// ---------- boot ----------
function start(hotData) {
  load(hotData && hotData.state);
  resize();
  syncActors(true);
  renderAll();
  window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { staticDirty = true; });
  requestAnimationFrame(t => { lastTick = t; requestAnimationFrame(tick); });
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ state: S }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
<!-- GAME:END -->
