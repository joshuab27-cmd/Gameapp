<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1d33">
<!-- GAME:START -->
<title>Revier 17</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
/* Layout: a 3D model of the whole station on top, the duty desk (cases, staff, log) underneath; phones put the cases below the model. */
:root {
  --night: #0f1d33;        /* page ground, police navy at night */
  --panel: #172a48;        /* desk / panel surface */
  --line: #2c4670;         /* floor-plan lines */
  --chalk: #e6edf7;        /* primary text */
  --muted: #8ea3c4;        /* secondary text */
  --signal: #3d8bff;       /* Blaulicht accent */
  --amber: #f2b33d;        /* budget / money */
  --ok: #4fcf8a;
  --bad: #ff5d5d;
  --display: "Saira Stencil One", "Impact", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --data: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--night);
  background-image:
    linear-gradient(rgba(61,139,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(61,139,255,.05) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--chalk);
  font: 15px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }

/* ---------- header ---------- */
header.hq {
  display: grid; gap: 12px;
  grid-template-columns: 1fr auto;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 14px 16px;
  position: relative; overflow: hidden;
}
header.hq::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
  background: linear-gradient(90deg, var(--signal) 0 50%, var(--bad) 50% 100%);
  animation: siren 1.2s infinite;
}
@keyframes siren { 50%, 100% { background: linear-gradient(90deg, var(--bad) 0 50%, var(--signal) 50% 100%); } }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { margin: 0; font: 400 clamp(26px, 5vw, 38px)/1 var(--display); letter-spacing: .02em; text-wrap: balance; }
.brand .sub { color: var(--muted); font: 600 12px/1 var(--data); letter-spacing: .14em; text-transform: uppercase; }
.lvl { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lvl .badge {
  width: 52px; height: 52px; flex: none;
  display: grid; place-items: center;
  font: 400 24px/1 var(--display);
  background: radial-gradient(circle at 50% 35%, #2a4f8c, #14284a);
  border: 2px solid var(--signal);
  clip-path: polygon(50% 0, 100% 18%, 92% 80%, 50% 100%, 8% 80%, 0 18%);
}
.xpbox { display: grid; gap: 4px; width: 170px; }
.xpbox small { color: var(--muted); font: 600 12px/1 var(--data); letter-spacing: .08em; text-transform: uppercase; }
.bar { height: 8px; background: #0b1527; border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--signal); }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: #0f2140; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-width: 0; display: grid; gap: 3px; }
.stat b { display: block; font: 700 clamp(17px, 3vw, 22px)/1.1 var(--data); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { color: var(--muted); font: 600 11px/1 var(--data); letter-spacing: .1em; text-transform: uppercase; }
.stat.money b { color: var(--amber); transition: transform .2s; }
.stat.money.pulse b { transform: scale(1.08); }
.stat .bar { height: 5px; }
.stat .bar > i { background: var(--amber); }
.stars { color: var(--amber); letter-spacing: 1px; }
.stars .off { color: #3b4b66; }

h2 {
  margin: 0 0 10px; font: 700 13px/1 var(--data); letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
h2 em { font-style: normal; color: var(--chalk); letter-spacing: .04em; }

/* ---------- 3D station ---------- */
.main { display: grid; gap: 16px; }
.stage-card { min-width: 0; }
.stage {
  position: relative; height: clamp(420px, 64vh, 660px);
  border: 2px solid var(--line); border-radius: 6px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 30%, #1b3156, #0b1527 75%);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.f3 {
  position: absolute; left: 0; top: 0; white-space: nowrap;
  font: 700 15px/1 var(--data); color: var(--amber); text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.6);
  will-change: transform, opacity;
}
.f3.big { font-size: 19px; }
.stage-hint {
  position: absolute; left: 10px; bottom: 10px; pointer-events: none;
  font: 600 11px/1.2 var(--data); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  background: rgba(11,21,39,.7); padding: 6px 8px; border-radius: 4px;
}
.nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
.pop {
  position: absolute; z-index: 5; width: 236px;
  background: rgba(16,30,54,.97); border: 1px solid var(--signal); border-radius: 6px;
  padding: 12px; display: grid; gap: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
.pop-x { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; border-radius: 4px; }
.pop-x:hover { color: var(--chalk); background: rgba(255,255,255,.06); }
.pop-name { font: 400 21px/1.05 var(--display); padding-right: 26px; }
.pop-state { font: 600 11px/1.2 var(--data); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pop-state.warn { color: var(--amber); }
.pop-line { font: 600 13px/1.35 var(--data); color: var(--muted); font-variant-numeric: tabular-nums; }
.pop-line b { color: var(--amber); }
.pop-line .pen { color: var(--bad); }
.pop-hint { font-size: 13px; line-height: 1.35; color: var(--muted); }
.pop-hint:empty { display: none; }
.pips { display: flex; gap: 3px; }
.pips i { width: 14px; height: 5px; background: #24385a; border-radius: 1px; }
.pips i.on { background: var(--signal); box-shadow: 0 0 6px rgba(61,139,255,.6); }

.btn {
  border: 1px solid var(--signal); background: rgba(61,139,255,.15);
  border-radius: 4px; padding: 8px 12px; font: 700 14px/1.1 var(--data); letter-spacing: .03em;
  display: inline-flex; gap: 6px; align-items: center; justify-content: center; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: rgba(61,139,255,.3); }
.btn:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); }
.btn.gold { border-color: var(--amber); background: rgba(242,179,61,.14); }
.btn.gold:hover:not(:disabled) { background: rgba(242,179,61,.28); }
.btn.ghost { border-color: var(--line); background: transparent; color: var(--muted); }

/* ---------- desk ---------- */
.desk { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0; }
.case { display: grid; gap: 6px; padding: 10px; border-radius: 4px; background: #0f2140; border-left: 3px solid var(--signal); }
.case + .case { margin-top: 8px; }
.case.active { border-left-color: var(--ok); }
.case.urgent { border-left-color: var(--bad); }
.case-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.case-top strong { font: 700 15px/1.2 var(--data); display: flex; gap: 7px; align-items: baseline; min-width: 0; }
.case-top strong i { width: 9px; height: 9px; border-radius: 2px; flex: none; transform: translateY(-1px); }
.case-top small { color: var(--muted); font: 600 11px/1 var(--data); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.case-meta { display: flex; gap: 10px; flex-wrap: wrap; font: 600 13px/1.2 var(--data); color: var(--muted); font-variant-numeric: tabular-nums; }
.case-meta .r { color: var(--amber); }
.case .bar { height: 6px; }
.case.active .bar > i { background: var(--ok); }
.case.urgent .bar > i { background: var(--bad); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
.staff { display: grid; gap: 8px; }
.staff-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; background: #0f2140; border-radius: 4px; }
.staff-row svg { display: block; }
.staff-row strong { display: block; font: 700 15px/1.2 var(--data); }
.staff-row strong span { color: var(--muted); font-weight: 600; }
.staff-row small { color: var(--muted); font-size: 12px; line-height: 1.3; display: block; }
.log { font: 500 13px/1.4 var(--data); color: var(--muted); display: grid; gap: 4px; max-height: 260px; overflow: auto; }
.log div b { color: var(--chalk); font-weight: 600; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 12px; }

/* ---------- overlays ---------- */
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; width: min(92vw, 380px); }
.toast { background: #0b1527; border: 1px solid var(--line); border-left: 3px solid var(--signal); padding: 9px 12px; border-radius: 4px; font: 600 14px/1.3 var(--data); animation: tin .25s ease-out; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.toast.bad { border-left-color: var(--bad); }
.toast.good { border-left-color: var(--ok); }
@keyframes tin { from { transform: translateY(10px); opacity: 0; } }
.modal-bg { position: fixed; inset: 0; z-index: 70; background: rgba(5,10,20,.75); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); border: 2px solid var(--signal); border-radius: 8px; padding: 22px; max-width: 420px; width: 100%; text-align: center; display: grid; gap: 12px; justify-items: center; }
.modal h3 { margin: 0; font: 400 32px/1 var(--display); }
.modal p { margin: 0; color: var(--muted); }
.modal .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

@media (max-width: 980px) {
  .desk { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .desk .log-card { grid-column: 1 / -1; }
}
@media (max-width: 700px) {
  .desk { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  header.hq { grid-template-columns: minmax(0, 1fr); }
  .xpbox { width: auto; flex: 1; }
  .stage { height: clamp(460px, 72vh, 640px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <header class="hq">
    <div class="brand">
      <h1>Polizeirevier 17</h1>
      <span class="sub">Bring die Wache auf Vordermann</span>
    </div>
    <div class="lvl">
      <div class="badge" id="lvlBadge">1</div>
      <div class="xpbox">
        <small id="lvlLabel">Revierstufe 1</small>
        <div class="bar"><i id="xpBar"></i></div>
        <small id="xpText">0 / 80 EP</small>
      </div>
    </div>
    <div class="stats">
      <div class="stat money" id="moneyStat"><span>Budget</span><b id="sMoney">0 €</b></div>
      <div class="stat"><span>Staatsbudget</span><b id="sIncome">0 €/s</b></div>
      <div class="stat"><span>Nächste Zuweisung</span><b id="sPay">0 €</b><div class="bar"><i id="payBar"></i></div></div>
      <div class="stat"><span>Ruf</span><b id="sRep" class="stars"></b></div>
    </div>
  </header>

  <div class="main">
    <section class="stage-card">
      <h2>Revier <em id="planInfo"></em></h2>
      <div class="stage" id="stage">
        <canvas id="cv" aria-label="3D-Modell des Polizeireviers. Ziehen zum Drehen, Raum antippen zum Ausbauen."></canvas>
        <div class="fx" id="fx"></div>
        <div class="stage-hint" id="stageHint">Ziehen zum Drehen · Zoomen · Raum antippen</div>
        <div class="pop" id="pop" hidden>
          <button class="pop-x" id="popX" type="button" aria-label="Schließen">×</button>
          <div class="pop-name" id="popName"></div>
          <div class="pop-state" id="popState"></div>
          <div class="pips" id="popPips"></div>
          <div class="pop-line" id="popLine"></div>
          <button class="btn gold" id="popBtn" type="button"></button>
          <div class="pop-hint" id="popHint"></div>
        </div>
      </div>
    </section>
    <div class="desk">
      <div class="card">
        <h2>Einsätze <em id="slotInfo"></em></h2>
        <div id="cases"></div>
      </div>
      <div class="card">
        <h2>Personal</h2>
        <div class="staff" id="staff"></div>
      </div>
      <div class="card log-card">
        <h2>Funkprotokoll</h2>
        <div class="log" id="log"></div>
        <div class="foot">
          <span>Spielstand wird automatisch gespeichert.</span>
          <button class="btn ghost" id="resetBtn" type="button">Neu anfangen</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script>
(() => {
'use strict';

// ---------- data ----------
const ROOMS = [
  { id: 'empfang',  name: 'Empfang',            unlock: 1,  cost: 40,      base: 1,    floor: '#c9b48f', tile: 22, color: '#d9a35b' },
  { id: 'buero',    name: 'Wachbüro',           unlock: 1,  cost: 150,     base: 3,    floor: '#56688a', tile: 0,  color: '#6f8fd1' },
  { id: 'zellen',   name: 'Gewahrsam',          unlock: 2,  cost: 600,     base: 9,    floor: '#868c94', tile: 44, color: '#a3acb8' },
  { id: 'verhoer',  name: 'Vernehmung',         unlock: 3,  cost: 2000,    base: 24,   floor: '#4b505a', tile: 0,  color: '#9b7fd6' },
  { id: 'fuhrpark', name: 'Fuhrpark',           unlock: 4,  cost: 6000,    base: 60,   floor: '#3b3f46', tile: 0,  color: '#4fb3d9' },
  { id: 'asservat', name: 'Asservatenkammer',   unlock: 6,  cost: 20000,   base: 150,  floor: '#b1a07c', tile: 30, color: '#c9a24a' },
  { id: 'labor',    name: 'Kriminaltechnik',    unlock: 8,  cost: 70000,   base: 400,  floor: '#d6dce3', tile: 18, color: '#4fcf8a' },
  { id: 'training', name: 'Einsatztraining',    unlock: 10, cost: 220000,  base: 1000, floor: '#3c7656', tile: 0,  color: '#7ccf4f' },
  { id: 'heli',     name: 'Hubschrauberplatz',  unlock: 13, cost: 750000,  base: 2800, floor: '#3a3f48', tile: 50, color: '#ff8a4f' },
  { id: 'leit',     name: 'Leitstelle',         unlock: 16, cost: 2500000, base: 8000, floor: '#24324a', tile: 0,  color: '#ff5d8f' },
];
const MAX_ROOM_LVL = 10;
const PAY_INTERVAL = 5; // seconds between two payments from the state

const MESS = [
  { name: 'Müllsäcke',     hp: 1 },
  { name: 'Spinnweben',    hp: 1 },
  { name: 'Aktenberg',     hp: 2 },
  { name: 'Kaputte Lampe', hp: 2 },
  { name: 'Graffiti',      hp: 3 },
  { name: 'Wasserschaden', hp: 3 },
  { name: 'Kakerlake',     hp: 1 },
];

const CASES = {
  empfang:  ['Fundsache abgeben', 'Anzeige: Fahrraddiebstahl', 'Verirrter Tourist'],
  buero:    ['Ruhestörung', 'Nachbarschaftsstreit', 'Falschparker-Welle'],
  zellen:   ['Kneipenschlägerei', 'Randale am Bahnhof', 'Betrunkener Autofahrer'],
  verhoer:  ['Einbruchserie', 'Taschendiebe-Bande', 'Erpressung'],
  fuhrpark: ['Verfolgungsjagd', 'Illegales Autorennen', 'Unfallflucht'],
  asservat: ['Drogenfund', 'Hehlerware sichern', 'Waffenfund im Park'],
  labor:    ['Mordfall Villa Rosen', 'Fingerabdruck-Rätsel', 'DNA-Abgleich'],
  training: ['Geiselnahme', 'Großeinsatz Fußballspiel', 'Amoklage (Übung)'],
  heli:     ['Bankraub mit Flucht', 'Vermisstensuche im Wald', 'Schmuggler auf der Autobahn'],
  leit:     ['Organisierte Kriminalität', 'Cyberangriff auf Rathaus', 'Großfahndung'],
};

const STAFF = [
  { id: 'officer', name: 'Streifenbeamte', unlock: 1, base: 120,  mult: 2.1, uniform: '#1f4f9a', cap: '#13284d', desc: n => `Fahren Einsätze automatisch · aktuell ${n}` },
  { id: 'janitor', name: 'Hausmeister',    unlock: 1, base: 200,  mult: 2.0, uniform: '#3c8d5a', cap: '#e8822e', desc: n => `Räumen selbstständig auf · aktuell ${n}` },
  { id: 'admin',   name: 'Verwaltung',     unlock: 3, base: 800,  mult: 2.3, uniform: '#6d7a8c', cap: null,      desc: n => `+15 % Staatsbudget je Kraft · aktuell +${n * 15} %` },
  { id: 'chief',   name: 'Kommissar',      unlock: 6, base: 5000, mult: 2.6, uniform: '#7a5a3a', cap: null,      desc: n => `Einsätze ${Math.min(60, n * 12)} % schneller, höhere Prämien` },
];

// two floor plans of the same building: wide screens get 5×2, phones 2×5. The Empfang always faces the street.
const LAYOUTS = {
  wide: { cols: 5, rows: 2, zw: 200, zh: 176, order: [[5, 6, 7, 8, 9], [0, 1, 2, 3, 4]] },
  tall: { cols: 2, rows: 5, zw: 200, zh: 168, order: [[8, 9], [6, 7], [4, 5], [2, 3], [0, 1]] },
};

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' Mrd.';
  if (n >= 1e6) return (n / 1e6).toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' Mio.';
  return n.toLocaleString('de-DE');
};
const eur = n => fmt(n) + ' €';
const rate = n => (n < 10 ? n.toLocaleString('de-DE', { maximumFractionDigits: 1 }) : fmt(n)) + ' €/s';
const xpNeed = l => Math.round(80 * Math.pow(1.55, l - 1));
const roomIdx = id => ROOMS.findIndex(r => r.id === id);
const upgradeCost = (r, lvl) => Math.round(r.cost * Math.pow(1.8, lvl));
const staffCost = (s, n) => Math.round(s.base * Math.pow(s.mult, (s.id === 'officer' || s.id === 'janitor') ? n - 1 : n));
function seeded(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function mix(a, b, t) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((A >> s) & 255) * (1 - t) + ((B >> s) & 255) * t);
  return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join('');
}
let uid = 1;

// ---------- state ----------
const SAVE_KEY = 'revier17-save-v1';
function freshState() {
  return {
    money: 30, xp: 0, level: 1, rep: 20,
    rooms: {}, staff: { officer: 1, janitor: 1, admin: 0, chief: 0 },
    cases: [], nextCase: 4, messTimer: 15, payT: 0, pending: 0,
    solved: 0, cleaned: 0, log: [], last: Date.now(), uid: 1,
  };
}
let S;

function makeMess(idx) {
  const kind = Math.floor(Math.random() * Math.min(MESS.length, 3 + idx));
  return { id: uid++, k: kind, hp: MESS[kind].hp + Math.floor(idx / 3), x: rand(14, 86), y: rand(34, 86) };
}
function unlockRooms(silent) {
  ROOMS.forEach((r, i) => {
    if (r.unlock <= S.level && !S.rooms[r.id]) {
      const n = Math.min(6, 3 + Math.floor(i / 2));
      S.rooms[r.id] = { lvl: 0, mess: Array.from({ length: n }, () => makeMess(i)) };
      if (!silent) log(`<b>${r.name}</b> freigeschaltet, völlig verwahrlost.`);
    }
  });
}

// ---------- economy: all money comes from the state ----------
function globalMult() { return (1 + S.staff.admin * 0.15) * (0.5 + S.rep / 100); }

function roomIncome(r, st) {
  if (!st || st.lvl === 0) return 0;
  const base = r.base * st.lvl * Math.pow(1.15, st.lvl - 1);

function totalIncome() { return baseGrant() + ROOMS.reduce((s, r) => s + roomIncome(r, S.rooms[r.id]), 0); }
function addXp(x) {
  S.xp += x;
  const startLvl = S.level;
  while (S.xp >= xpNeed(S.level)) { S.xp -= xpNeed(S.level); S.level++; }
  if (S.level > startLvl) {
    unlockRooms();
    const fresh = ROOMS.filter(r => r.unlock > startLvl && r.unlock <= S.level);
    const bonus = 50 * S.level * S.level;
    S.money += bonus;
    log(`Revier erreicht <b>Stufe ${S.level}</b>! Sonderzuweisung: ${eur(bonus)}`);
    showLevelUp(S.level, fresh, bonus);
    markDirty();
  }
}
function addRep(d) { S.rep = clamp(S.rep + d, 0, 100); }

// ---------- actions ----------

  markDirty();
}
function removeMess(idx, m) {

}
function upgradeRoom(idx) {
  const r = ROOMS[idx]; const st = S.rooms[r.id];
  if (!st || st.lvl >= MAX_ROOM_LVL) return;
  const cost = upgradeCost(r, st.lvl);
  if (S.money < cost) return;
  S.money -= cost;
  st.lvl++;
  if (st.lvl === 1) st.mess = []; // the renovation crew clears out the old junk
  addXp(Math.round(10 * Math.pow(cost, 0.36)));
  addRep(st.lvl === 1 ? 4 : 1);
  log(st.lvl === 1 ? `<b>${r.name}</b> renoviert.` : `<b>${r.name}</b> auf Stufe ${st.lvl} ausgebaut.`);
  view && view.celebrate(idx);
  markDirty();
}

  const s = STAFF.find(s => s.id === id);
  const cost = staffCost(s, S.staff[id]);
  if (S.money < cost || S.level < s.unlock) return;
  S.money -= cost; S.staff[id]++;

}
const activeCount = () => S.cases.filter(c => c.active).length;
function spawnCase() {
  const avail = ROOMS.filter(r => S.rooms[r.id] && S.rooms[r.id].lvl > 0);
  if (!avail.length) return;
  const r = avail[Math.min(avail.length - 1, Math.floor(Math.pow(Math.random(), 0.7) * avail.length))];
  const st = S.rooms[r.id]; const idx = roomIdx(r.id);
  const speed = 1 - Math.min(0.6, st.lvl * 0.04 + S.staff.chief * 0.12);
  const dur = Math.max(8, Math.round((12 + idx * 5) * speed));
  const reward = Math.round(r.base * 20 * (1 + st.lvl * 0.2) * (1 + S.staff.chief * 0.1) * rand(0.8, 1.3));
  S.cases.push({
    id: uid++, room: r.id, title: pick(CASES[r.id]), dur, reward,
    xp: Math.round(12 * (idx + 1) * (1 + st.lvl * 0.1)),
    expire: 40, age: 0, active: false, t: 0,
  });

  markDirty();
}

// ---------- simulation ----------
function step(dt) {
  // the state pays its budget in regular instalments
  S.pending += totalIncome() * dt;
  S.payT += dt;
  if (S.payT >= PAY_INTERVAL) {
    S.payT -= PAY_INTERVAL;
    const amt = S.pending; S.pending = 0;
    S.money += amt;
    if (amt >= 1) { view && view.payout(amt); pulseMoney(); }
  }

  // free officers take open cases automatically, oldest first
  const open = S.cases.filter(c => !c.active).sort((a, b) => b.age - a.age);
  for (const c of open) { if (activeCount() >= S.staff.officer) break; c.active = true; c.t = 0; markDirty(); }

  for (const c of S.cases) {
    if (c.active) {
      c.t += dt;
      if (c.t >= c.dur) {
        c.done = true;
        S.solved++;
        S.money += c.reward;
        addXp(c.xp);
        addRep(2);
        view && view.caseDone(c);
        log(`Gelöst: <b>${c.title}</b> · Prämie ${eur(c.reward)}`);
        markDirty();
      }
    } else {
      c.age += dt;
      if (c.age >= c.expire) {
        c.done = true;
        addRep(-3);
        toast(`Keine Streife frei: ${c.title} verpasst. Der Ruf leidet.`, 'bad');
        log(`Verpasst: <b>${c.title}</b>`);
        markDirty();
      }
    }
  }
  S.cases = S.cases.filter(c => !c.done);
  S.nextCase -= dt;
  if (S.nextCase <= 0) {
    if (S.cases.filter(c => !c.active).length < 4) spawnCase();
    S.nextCase = rand(8, 15) * Math.max(0.5, 1 - S.staff.officer * 0.04);
  }

  // new mess appears over time in running rooms
  S.messTimer -= dt;
  if (S.messTimer <= 0) {
    S.messTimer = rand(14, 24);
    ROOMS.forEach((r, i) => {
      const st = S.rooms[r.id];
      if (st && st.lvl > 0 && st.mess.length < 4 && Math.random() < 0.35 * (1 - st.lvl * 0.06)) {
        st.mess.push(makeMess(i)); markDirty();
      }
    });
  }
}

const M = 14, SIDEWALK = 22, STREET = 60;

}
const zone = i => { const { c, r } = cells[i]; return { x: M + c * L.zw, y: M + r * L.zh, w: L.zw, h: L.zh }; };

}

  }
  function resize() {
    W = stage.clientWidth; H = stage.clientHeight;
    renderer.setSize(W, H, false);
    camera.aspect = W / H; camera.updateProjectionMatrix();
    const want = W < 620 ? 'tall' : 'wide';
    if (want !== layoutName) {
      setLayout(want);
      rebuildAll();
      for (const a of actors) { if (a.room >= 0) { const p = randIn(a.room); a.x = p.x; a.y = p.y; } else { const o = outside(); a.x = o.x; a.y = o.y; } a.path = []; }
    }
    if (framedLayout !== layoutName + W + 'x' + H) { frame(); framedLayout = layoutName + W + 'x' + H; }
  }
  function rebuildAll() {
    buildGround(); buildWalls();
    ROOMS.forEach((_, i) => buildRoom(i));
    messSig = ''; wallSig = '';
  }

  // ---- input ----
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let down = null;
  cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  cv.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
    if (moved > 8 || dt > 600) return;
    const b = cv.getBoundingClientRect();
    ndc.set(((e.clientX - b.left) / b.width) * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const mh = ray.intersectObjects(messGroup.children, true)[0];
    if (mh) {
      let o = mh.object; while (o && o.userData.mid === undefined) o = o.parent;
      if (o) { const st = S.rooms[ROOMS[o.userData.room].id]; const m = st && st.mess.find(x => x.id === o.userData.mid); if (m) { hitMess(o.userData.room, m); sparks(mh.point, 4, 0.5); return; } }
    }
    const targets = [];
    roomGroups.forEach(g => g && g.traverse(o => { if (o.userData.room !== undefined && o.isMesh) targets.push(o); }));
    arrows.forEach(a => a && a.visible && targets.push(a));
    const hit = ray.intersectObjects(targets, false)[0];
    if (hit) { const i = hit.object.userData.room; select(i === sel ? null : i); }

  });

  // ---- per-frame update ----
  let wallSig = '';
  const tmp = new THREE.Vector3();
  function update(dt) {

    const ws = ROOMS.map((r, i) => isOpen(i) ? 1 : 0).join('');
    if (ws !== wallSig) { wallSig = ws; buildWalls(); }
    const ms = ROOMS.map(r => S.rooms[r.id] ? S.rooms[r.id].mess.map(m => m.id).join(',') : '').join('|');
    if (ms !== messSig) { messSig = ms; buildMess(); }

    syncActors(false);
    for (const a of actors) updateActor(a, dt);
    for (const a of actors) if (a.gone) removeActor(a);
    actors = actors.filter(a => !a.gone);
    updateCars(dt);

    // actors to meshes
    for (const a of actors) {
      const g = a.mesh.g;
      g.visible = !a.hidden;
      if (a.hidden) continue;
      const p = to3(a.x, a.y); g.position.set(p.x, 0, p.z);

    for (const car of cars) {

      car.mesh.rotation.y = car.dir < 0 ? Math.PI : 0;
      const lit = car.phase !== 'park' && car.phase !== 'done';
      car.mesh.userData.glowA.material.opacity = lit && on ? 0.9 : 0;

    }
    for (const f of anims) f(T, dt);
    for (const f of messAnims) f(T, dt);

    // upgrade arrows and selection
    ROOMS.forEach((r, i) => {
      const a = arrows[i]; if (!a) return; const st = S.rooms[r.id];
      a.visible = !!st && st.lvl < MAX_ROOM_LVL && S.money >= upgradeCost(r, st.lvl);
      a.position.y = 2.3 + Math.sin(T * 4 + i) * 0.15;
    });
    if (sel !== null) {
      const z = zone(sel); const c = to3(z.x + z.w / 2, z.y + z.h / 2);
      selBox.visible = true; selBox.position.set(c.x, 0.06, c.z);
      const [n, s, w, e] = selBox.children, t = 0.16;
      n.scale.set(RW, 0.08, t); n.position.set(0, 0, -RD / 2 + 0.3);
      s.scale.set(RW, 0.08, t); s.position.set(0, 0, RD / 2 - 0.3);
      w.scale.set(t, 0.08, RD); w.position.set(-RW / 2 + 0.3, 0, 0);
      e.scale.set(t, 0.08, RD); e.position.set(RW / 2 - 0.3, 0, 0);
      selBox.children.forEach(m => { m.material.color.setHSL(0.6, 1, 0.55 + Math.sin(T * 5) * 0.1); });
    } else selBox.visible = false;

    // particles
    for (const p of parts) { p.life += dt; p.v.y -= 9 * dt; p.s.position.addScaledVector(p.v, dt); p.s.material.opacity = 1 - p.life / p.max; }
    for (const p of parts) if (p.life >= p.max) { scene.remove(p.s); p.s.material.dispose(); }
    for (let k = parts.length - 1; k >= 0; k--) if (parts[k].life >= parts[k].max) parts.splice(k, 1);

    controls.update();
    renderer.render(scene, camera);

    // HTML overlays follow the camera
    for (const f of floats) {
      f.life += dt;
      tmp.copy(f.pos); tmp.y += f.life * 1.4; tmp.project(camera);
      const x = (tmp.x * 0.5 + 0.5) * W, y = (-tmp.y * 0.5 + 0.5) * H;
      f.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
      f.el.style.opacity = clamp((1 - f.life / f.max) * 2, 0, 1);
    }
    for (let k = floats.length - 1; k >= 0; k--) if (floats[k].life >= floats[k].max) { floats[k].el.remove(); floats.splice(k, 1); }

  }
  function screenOf(i, back) {

    return { x: (c.x * 0.5 + 0.5) * W, y: (-c.y * 0.5 + 0.5) * H };
  }

  setLayout(stage.clientWidth < 620 ? 'tall' : 'wide');
  rebuildAll();
  resize();
  syncActors(true);
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { roomSig.length = 0; buildGround(); });

  return {
    update, screenOf, spawnCivilian,
    reset() { actors.forEach(removeActor); actors = []; cars.forEach(c => scene.remove(c.mesh)); cars = []; syncActors(true); },
    payout(amt) { const e = entrance(); const p = to3(e.x, e.y - 40); p.y = 3.2; float3(p, '+' + eur(amt) + ' vom Staat', true); sparks(p, 8, 0.8); },
    caseDone(c) { const e = entrance(); const p = to3(e.x + 60, curbY(0)); p.y = 2; float3(p, `Gelöst: +${eur(c.reward)} Prämie`, false, '#4fcf8a'); },
    puff(idx, m) { const p = messPos(m, zone(idx), T); const v = to3(p.x, p.y); v.y = 0.5; sparks(v, 6, 0.6); },
    celebrate(idx) { const z = zone(idx); const c = to3(z.x + z.w / 2, z.y + z.h / 2); c.y = 1; sparks(c, 26, 1.6); },
  };
}

// ---------- save / load ----------
function save() {

  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {}
}
function load(snapshot) {
  let data = snapshot && snapshot.money !== undefined ? snapshot : null;
  if (!data) { try { data = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (_) { data = null; } }
  S = Object.assign(freshState(), data || {});
  S.staff = Object.assign(freshState().staff, S.staff || {});
  if (S.staff.janitor < 1) S.staff.janitor = 1;
  uid = S.uid || 1;
  unlockRooms(true);
  if (!data) { log('Dienstantritt in Revier 17. Das Geld kommt vom Staat, du entscheidest, wofür es ausgegeben wird.'); return; }
  const away = Math.min(2 * 3600, (Date.now() - (S.last || Date.now())) / 1000);
  if (away > 60 && !snapshot) {
    const earned = totalIncome() * away * 0.5;
    if (earned > 1) {
      S.money += earned;
      const m = modal(`${starSvg()}<h3>Willkommen zurück</h3>
        <p>Während deiner Abwesenheit (${Math.round(away / 60)} Min.) hat der Staat <b style="color:var(--amber)">${eur(earned)}</b> überwiesen.</p>
        <div class="row"><button class="btn gold" type="button" id="mOk">Dienst antreten</button></div>`);
      m.root.querySelector('#mOk').addEventListener('click', m.close);

}

// ---------- loop ----------
let lastTick = performance.now(), saveTimer = 0;
function tick(now) {

  lastTick = now;
  step(dt);
  if (view) view.update(dt); else T += dt;
  if (dirty) { dirty = false; renderAll(); } else renderLive();
  saveTimer += dt;
  if (saveTimer > 5) { save(); saveTimer = 0; }
  requestAnimationFrame(tick);
}

// ---------- boot ----------
function start(hotData) {

  try {
    if (!window.THREE || !window.THREE.OrbitControls) throw new Error('three missing');
    view = createView();
  } catch (err) {
    view = null;
    setLayout('wide');
    $('stageHint').hidden = true;
    const d = document.createElement('div'); d.className = 'nogl';
    d.textContent = '3D-Grafik konnte nicht geladen werden. Das Revier läuft trotzdem weiter, das Staatsbudget kommt wie gewohnt.';
    $('stage').appendChild(d);

}
