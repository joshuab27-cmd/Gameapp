<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <title>Revier 13</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="badge">🚔</span>
      <div>
        <div class="title">Revier 13</div>
        <div class="rank" id="rank">Bruchbude</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat" title="Geld"><span>💶</span><b id="money">0</b></div>
      <div class="stat" title="Ruf"><span>⭐</span><b id="rep">0</b></div>
      <div class="stat" title="Beamte"><span>👮</span><b id="officers">1/2</b></div>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Menü">⚙️</button>
  </header>

  <div class="progress-wrap">
    <div class="progress-label"><span>Modernisierung</span><span id="modPct">0%</span></div>
    <div class="progress"><div class="bar" id="modBar"></div></div>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="station" class="active">🏢 Revier</button>
    <button data-tab="cases">📻 Einsätze <span class="pill" id="casePill">0</span></button>
    <button data-tab="staff">👮 Personal</button>
  </nav>

  <main class="layout">
    <section class="panel station-panel" data-panel="station">
      <h2>Das Revier <small>Tippe auf Müll zum Aufräumen, auf einen Raum zum Renovieren</small></h2>
      <div class="station" id="station"></div>
    </section>

    <section class="panel" data-panel="cases">
      <h2>Einsatzzentrale <small id="autoInfo"></small></h2>
      <h3>Offene Meldungen</h3>
      <div id="queue" class="list"></div>
      <h3>Laufende Einsätze</h3>
      <div id="active" class="list"></div>
    </section>

    <section class="panel" data-panel="staff">
      <h2>Personal</h2>
      <div id="staff" class="list"></div>
      <button class="btn primary wide" id="hireBtn">Beamten einstellen</button>
      <h3>Funkprotokoll</h3>
      <div id="log" class="log"></div>
    </section>
  </main>

  <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"></div>

  <div class="overlay hidden" id="overlay"></div>
  <div id="toasts" class="toasts"></div>

  <script src="game.js"></script>
</body>
</html>
